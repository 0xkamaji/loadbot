name: Loadbot GUI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Menu and browser embedding
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src/gui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/gui/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loadbot-browser-evidence
          path: src/gui/test-results/

  desktop:
    name: Desktop compilation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/gui/package-lock.json
      - run: rustup toolchain install stable --profile minimal --component rustfmt
      - run: rustup default stable
      - name: Native desktop prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf
      - run: npm --prefix src/gui ci
      - run: npm --prefix src/gui run build
      - name: Windows adapter and frontend tests
        if: runner.os == 'Windows'
        run: npm --prefix src/gui test
      - run: cargo fmt --manifest-path src/gui/src-tauri/Cargo.toml --check
      - run: cargo check --locked --manifest-path src/gui/src-tauri/Cargo.toml --features custom-protocol
