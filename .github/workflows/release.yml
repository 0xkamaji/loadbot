name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate version tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - name: Verify version metadata
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi

          version="${GITHUB_REF_NAME#v}"
          cli_version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "loadbot") | .version')
          desktop_version=$(cargo metadata --locked --no-deps --format-version 1 --manifest-path src/gui/src-tauri/Cargo.toml | jq -r '.packages[] | select(.name == "loadbot-desktop") | .version')
          frontend_version=$(jq -r '.version' src/gui/package.json)
          tauri_version=$(jq -r '.version' src/gui/src-tauri/tauri.conf.json)

          for declared in "$cli_version" "$desktop_version" "$frontend_version" "$tauri_version"; do
            if [[ "$declared" != "$version" ]]; then
              echo "Tag $GITHUB_REF_NAME does not match declared version $declared." >&2
              exit 1
            fi
          done

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/gui/package-lock.json
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - name: Install Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev build-essential libxdo-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config patchelf
      - name: Build CLI
        run: cargo build --release --locked
      - name: Install frontend dependencies
        run: npm --prefix src/gui ci
      - name: Build Linux desktop
        if: runner.os == 'Linux'
        run: npm --prefix src/gui run desktop:build -- --ci -- --locked
      - name: Stage Windows CLI for the installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "src/gui/src-tauri/binaries" | Out-Null
          Copy-Item "target/release/loadbot.exe" "src/gui/src-tauri/binaries/loadbot-${{ matrix.target }}.exe"
      - name: Validate Windows installer PATH helper
        if: runner.os == 'Windows'
        shell: pwsh
        run: '[scriptblock]::Create((Get-Content -Raw "src/gui/src-tauri/nsis/user-path.ps1")) | Out-Null'
      - name: Build Windows desktop and installer
        if: runner.os == 'Windows'
        run: npm --prefix src/gui run desktop:bundle:windows -- --ci -- --locked
      - name: Package Linux binaries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          package="loadbot-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$package"
          install -m 755 target/release/loadbot "dist/$package/loadbot"
          install -m 755 src/gui/src-tauri/target/release/loadbot-desktop "dist/$package/loadbot-desktop"
          install -m 755 packaging/linux/install.sh "dist/$package/install.sh"
          tar -C dist -czf "dist/$package.tar.gz" "$package"
      - name: Package Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = "loadbot-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory -Force "dist/$package" | Out-Null
          Copy-Item "target/release/loadbot.exe" "dist/$package/loadbot.exe"
          Copy-Item "src/gui/src-tauri/target/${{ matrix.target }}/release/loadbot-desktop.exe" "dist/$package/loadbot-desktop.exe"
          Compress-Archive -Path "dist/$package" -DestinationPath "dist/$package.zip"
          $installers = @(Get-ChildItem "src/gui/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe")
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)"
          }
          Copy-Item $installers[0].FullName "dist/$package-setup.exe"
      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/loadbot-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 1
      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: release-installer-${{ matrix.target }}
          path: dist/loadbot-${{ github.ref_name }}-${{ matrix.target }}-setup.exe
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Generate checksums
        working-directory: release
        run: sha256sum loadbot-* > SHA256SUMS.txt
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --verify-tag \
              --title "Loadbot $GITHUB_REF_NAME" \
              --generate-notes
          fi
